name: Extract tea catalog
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python extract_teas.py
      - uses: actions/upload-artifact@v4
        with:
          name: tea-catalog-extracted
          path: out/
          retention-days: 1
